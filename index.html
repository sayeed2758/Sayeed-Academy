<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07152f"><meta name="app-version" content="6.0.0-premium">
<meta name="description" content="Sayeed Academy — premium chapter-wise audio learning for Classes 6 to 10.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/logo.png">
<link rel="stylesheet" href="assets/css/style.css">
<title>Sayeed Academy • Audio Learning Pro • Premium</title>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img src="assets/icons/logo.png" alt="Sayeed Academy" class="brand-logo">
      <div class="brand-copy"><strong>Sayeed Academy</strong><span>Audio Learning Pro</span></div>
      <button class="icon-btn mobile-close" id="closeSidebar" aria-label="Close menu">×</button>
    </div>
    <div class="sidebar-label">LEARNING</div>
    <nav class="nav">
      <button class="nav-item active" data-view="home"><span>⌂</span>Dashboard</button>
      <button class="nav-item" data-view="library"><span>▦</span>Audio Library</button>
      <button class="nav-item" data-view="favorites"><span>★</span>Favorites</button>
      <button class="nav-item" data-view="history"><span>◷</span>Listening History</button>
      <button class="nav-item" data-view="analytics"><span>◈</span>Analytics</button>
    </nav>
    <div class="sidebar-label">MANAGEMENT</div>
    <nav class="nav">
      <button class="nav-item" data-view="manager"><span>⚙</span>Content Manager</button>
      <button class="nav-item" data-view="backup"><span>⇅</span>Backup & Restore</button>
    </nav>
    <div class="sidebar-bottom">
      <div class="mini-card">
        <span class="mini-dot"></span>
        <div><strong>Offline-ready</strong><small>Your library stays available on this device.</small></div>
      </div>
      <button class="theme-btn" id="themeToggle">☾ <span>Dark mode</span></button>
    </div>
  </aside>

  <div class="backdrop" id="backdrop"></div>
  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="openSidebar" aria-label="Open menu">☰</button>
      <div class="crumbs"><span>SAYEED ACADEMY</span><b>•</b><strong id="pageTitle">Dashboard</strong></div>
      <div class="top-actions">
        <button class="icon-btn" id="topTheme" title="Toggle theme">☾</button>
        <button class="avatar-btn" id="quickManager" title="Open Content Manager">SA</button>
      </div>
    </header>
    <div id="appContent"></div>
  </main>

  <section class="player" id="player">
    <div class="player-main">
      <div class="player-art" id="playerArt">▶</div>
      <div class="player-meta">
        <strong id="playerTitle">Nothing playing</strong>
        <span id="playerSub">Choose a chapter from the library</span>
      </div>
      <button class="player-star" id="playerFav" title="Favorite">☆</button>
    </div>
    <div class="player-controls">
      <button class="small-control" id="prevPart" title="Previous part">⏮</button>
      <button class="small-control" id="back15" title="Back 15 seconds">↶15</button>
      <button class="play-control" id="playPause">▶</button>
      <button class="small-control" id="forward15" title="Forward 15 seconds">↷15</button>
      <button class="small-control" id="nextPart" title="Next part">⏭</button>
    </div>
    <div class="player-progress">
      <span id="currentTime">00:00</span>
      <input type="range" id="seekBar" min="0" max="100" value="0" aria-label="Audio progress">
      <span id="duration">00:00</span>
    </div>
    <audio id="audio" preload="metadata"></audio>
    <button class="icon-btn player-close" id="closePlayer" title="Close player">×</button>
  </section>
</div>

<div class="modal hidden" id="modal">
  <div class="modal-backdrop" data-close-modal></div>
  <div class="modal-card" id="modalCard"></div>
</div>
<div class="toast-wrap" id="toastWrap"></div>
<script src="assets/js/app.js"></script>
</body>
</html>
